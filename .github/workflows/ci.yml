name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Browser experience contract tests
        run: node --test web/tests/*.test.mjs

      - name: React presentation contract tests
        run: node --test apps/commons-react/tests/*.test.mjs

      - name: Install React dependencies
        run: npm install --prefix apps/commons-react --no-audit --no-fund

      - name: Compile React GitHub Pages build
        env:
          COMMONS_BASE_PATH: /Infinite-Commons/
        run: |
          npm run build --prefix apps/commons-react
          test -s apps/commons-react/dist/index.html
          grep -q '/Infinite-Commons/assets/' apps/commons-react/dist/index.html

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest
